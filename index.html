<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
/* Design tokens */
:root {
  --crimson: #930531;
  --crimson2: #990531;
  --flame: #CC5311;
  --ember: #f0a14b;
  --night: #16050d;
  --night2: #260714;
  --surface: rgba(255, 250, 242, .92);
  --surface2: rgba(255, 236, 214, .12);
  --ink: #fff7ef;
  --ink2: #ead5c8;
  --ink3: #bda195;
  --paper: #fff8ef;
  --paper-ink: #281018;
  --border: rgba(255, 216, 184, .22);
  --font-serif: Georgia, 'Noto Serif TC', 'Noto Serif SC', serif;
  --font-sans: 'Noto Sans TC', 'Noto Sans SC', system-ui, sans-serif;
  --font-mono: 'Courier New', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  overflow-x: hidden;
  background:
    linear-gradient(115deg, rgba(204,83,17,.20), transparent 35%),
    linear-gradient(180deg, #210812 0%, #14050c 46%, #2a0714 100%);
  color: var(--ink);
  font-family: var(--font-sans);
}
body::before {
  content: '';
  position: fixed;
  inset: -20vh -15vw;
  z-index: -2;
  background:
    linear-gradient(104deg, transparent 4%, rgba(255,200,124,.12) 9%, transparent 15%),
    linear-gradient(76deg, transparent 58%, rgba(255,151,58,.10) 63%, transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 80px);
  transform: rotate(-5deg);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(180deg, transparent, rgba(0,0,0,.32)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 5px);
  mix-blend-mode: screen;
  opacity: .55;
  pointer-events: none;
}

/* Header */
header {
  position: relative;
  overflow: hidden;
  padding: clamp(2.4rem, 7vw, 5.6rem) 1.5rem clamp(2rem, 5vw, 4rem);
}
header::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(110deg, transparent 0 28%, rgba(255,204,150,.20) 38%, transparent 53%),
    linear-gradient(180deg, rgba(147,5,49,.78), rgba(22,5,13,.12));
  pointer-events: none;
}
header::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0;
  width: min(940px, calc(100vw - 3rem));
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,215,176,.78), transparent);
  transform: translateX(-50%);
}
.header-grid {
  position: relative;
  max-width: 1120px;
  margin: 0 auto;
}
.title-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 1.5rem;
}
.site-title {
  min-width: 0;
  max-width: 780px;
  font-family: var(--font-serif);
  font-size: clamp(2.4rem, 8vw, 6.8rem);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: 0;
  color: #fff7ef;
  text-shadow: 0 0 34px rgba(204,83,17,.28);
}
.title-main {
  display: block;
  padding: .05em 0 .13em;
  background: linear-gradient(92deg, #fff7ef 0%, #ffd5a4 44%, #fff7ef 64%, #d77a38 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: titleLight 8s ease-in-out infinite;
}
.site-title small {
  display: block;
  margin-top: .85rem;
  font-family: var(--font-mono);
  font-size: clamp(.72rem, 1.4vw, .92rem);
  font-weight: 400;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: rgba(255,235,214,.72);
}
.hero-copy {
  margin-top: 1.15rem;
  max-width: 560px;
  color: rgba(255,242,226,.74);
  font-size: clamp(.95rem, 1.8vw, 1.08rem);
  line-height: 1.8;
}
@keyframes titleLight {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* Lang switch */
.lang-switch {
  justify-self: end;
  margin-top: calc((clamp(2.4rem, 8vw, 6.8rem) * 1.08 - 2.35rem) / 2);
  display: inline-flex;
  gap: .25rem;
  padding: .25rem;
  border: 1px solid rgba(255,228,197,.28);
  background: rgba(255,255,255,.07);
  backdrop-filter: blur(16px);
}
.lang-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2.7rem;
  border: 0;
  background: transparent;
  color: rgba(255,239,222,.78);
  padding: .48rem .72rem;
  font-family: var(--font-mono);
  font-size: .82rem;
  letter-spacing: .08em;
  text-decoration: none;
  cursor: pointer;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
.lang-btn:hover,
.lang-btn:focus-visible { color: #fff; outline: none; transform: translateY(-1px); }
.lang-btn.active { background: #fff7ef; color: var(--crimson); font-weight: 700; }

/* Year nav */
.year-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(22,5,13,.82);
  border-block: 1px solid rgba(255,218,182,.16);
  box-shadow: 0 16px 42px rgba(0,0,0,.24);
  backdrop-filter: blur(18px);
}
.year-nav-inner {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 1rem;
}
.year-nav-inner::-webkit-scrollbar { display: none; }
.search-row {
  display: flex;
  align-items: center;
  gap: .75rem;
  max-width: 1120px;
  margin: 0 auto;
  padding: .78rem 1rem .2rem;
}
.search-label {
  flex: 0 0 auto;
  color: rgba(255,235,214,.58);
  font-family: var(--font-mono);
  font-size: .72rem;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.search-box {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
}
.search-input {
  width: 100%;
  border: 1px solid rgba(255,226,198,.18);
  background:
    linear-gradient(90deg, rgba(147,5,49,.18), rgba(204,83,17,.08)),
    rgba(255,255,255,.045);
  color: #fff8ed;
  padding: .56rem 2.4rem .56rem .78rem;
  font-family: var(--font-sans);
  font-size: .9rem;
  outline: none;
  transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.search-input::placeholder { color: rgba(255,235,214,.42); }
.search-input:focus {
  border-color: rgba(255,226,198,.42);
  box-shadow: 0 0 24px rgba(204,83,17,.14);
}
.search-clear {
  position: absolute;
  right: .35rem;
  top: 50%;
  width: 1.65rem;
  height: 1.65rem;
  border: 0;
  background: transparent;
  color: rgba(255,235,214,.58);
  cursor: pointer;
  transform: translateY(-50%);
  opacity: 0;
  pointer-events: none;
  transition: color .18s ease, opacity .18s ease;
}
.search-clear.visible {
  opacity: 1;
  pointer-events: auto;
}
.search-clear:hover,
.search-clear:focus-visible {
  color: #fff8ed;
  outline: none;
}
.filter-rail {
  display: flex;
  gap: .45rem;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  max-width: 1120px;
  margin: 0 auto;
  padding: .72rem 1rem .82rem;
  border-top: 1px solid rgba(255,218,182,.10);
}
.filter-rail::-webkit-scrollbar { display: none; }
.filter-chip {
  --cat-color: var(--flame);
  text-decoration: none;
  flex: 0 0 auto;
  border: 1px solid rgba(255,226,198,.18);
  background: rgba(255,255,255,.045);
  color: rgba(255,235,214,.62);
  padding: .38rem .72rem;
  font-family: var(--font-sans);
  font-size: .82rem;
  line-height: 1;
  cursor: pointer;
  transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
}
.filter-chip:hover,
.filter-chip:focus-visible {
  outline: none;
  color: #fff8ed;
  border-color: rgba(255,226,198,.34);
  transform: translateY(-1px);
}
.filter-chip.active {
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--cat-color) 78%, var(--crimson)), color-mix(in srgb, var(--cat-color) 82%, var(--flame)));
  border-color: color-mix(in srgb, var(--cat-color) 58%, rgba(255,226,198,.42));
  color: #fffaf2;
}
.filter-chip .badge {
  margin-left: .35rem;
  color: var(--ember);
  font-family: var(--font-mono);
  font-size: .68rem;
}
.filter-chip.active .badge { color: #ffe1bd; }
.year-tab {
  position: relative;
  flex: 0 0 auto;
  padding: 1rem 1.25rem;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: rgba(255,235,214,.52);
  font-family: var(--font-mono);
  font-size: .95rem;
  font-weight: 700;
  letter-spacing: .06em;
  white-space: nowrap;
  cursor: pointer;
  transition: color .2s ease, border-color .2s ease;
}
.year-tab::after {
  content: '';
  position: absolute;
  left: 1rem;
  right: 1rem;
  bottom: .45rem;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--flame), transparent);
  opacity: 0;
  transition: opacity .2s ease;
}
.year-tab:hover,
.year-tab.active { color: #fff8ed; border-bottom-color: rgba(204,83,17,.85); }
.year-tab.active::after { opacity: 1; }
.year-tab .badge {
  display: inline-block;
  margin-left: .38rem;
  font-size: .68rem;
  font-weight: 400;
  color: var(--ember);
}

/* Main */
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: clamp(2.3rem, 5vw, 4.5rem) 1.5rem 6rem;
}
.year-section {
  display: block;
  min-height: min(760px, calc(100vh - 4.25rem));
  padding-bottom: clamp(3.5rem, 9vw, 7rem);
  scroll-margin-top: 5.1rem;
}
.year-section + .year-section {
  padding-top: clamp(1.2rem, 3vw, 2.5rem);
}
.year-section.active .year-heading .yr {
  text-shadow: 0 0 28px rgba(255,181,103,.24);
}

/* Year heading */
.year-heading {
  display: flex;
  align-items: baseline;
  gap: .9rem 1.2rem;
  flex-wrap: wrap;
  margin-bottom: clamp(2rem, 5vw, 3.7rem);
  padding-bottom: 1.2rem;
  border-bottom: 1px solid rgba(255,219,181,.18);
}
.year-heading .yr {
  font-family: var(--font-serif);
  font-size: clamp(2.3rem, 7vw, 5rem);
  font-weight: 700;
  line-height: .95;
  color: #fff4e8;
}
.year-heading .yr-sub {
  font-family: var(--font-mono);
  font-size: .82rem;
  color: rgba(255,220,190,.62);
  letter-spacing: .18em;
  text-transform: uppercase;
}

/* Timeline */
.timeline-track { position: relative; padding-bottom: 1rem; }
.timeline-track::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background:
    linear-gradient(180deg, transparent, rgba(255,231,191,.9) 12%, rgba(204,83,17,.95) 48%, rgba(153,5,49,.85) 86%, transparent),
    linear-gradient(180deg, var(--crimson), var(--flame));
  box-shadow: 0 0 28px rgba(204,83,17,.35);
  transform: translateX(-50%);
}

.t-node {
  --cat-color: var(--flame);
  display: grid;
  grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
  align-items: start;
  margin-bottom: clamp(1.2rem, 3vw, 2.2rem);
}
.t-node.side-left .t-spine { grid-column: 2; grid-row: 1; }
.t-node.side-left .t-trigger { grid-column: 1; grid-row: 1; justify-self: end; padding-right: 1.5rem; text-align: right; }
.t-node.side-left .t-cardwrap { grid-column: 3; grid-row: 1; padding-left: 1.5rem; }
.t-node.side-right .t-spine { grid-column: 2; grid-row: 1; }
.t-node.side-right .t-trigger { grid-column: 3; grid-row: 1; justify-self: start; padding-left: 1.5rem; text-align: left; }
.t-node.side-right .t-cardwrap { grid-column: 1; grid-row: 1; padding-right: 1.5rem; }

.t-spine { display: flex; justify-content: center; padding-top: .85rem; }
.t-dot-btn {
  position: relative;
  z-index: 2;
  width: 18px;
  height: 18px;
  border: 1px solid rgba(255,246,229,.92);
  border-radius: 50%;
  background: var(--cat-color);
  box-shadow:
    0 0 0 7px rgba(255,246,229,.08),
    0 0 22px rgba(204,83,17,.46);
  cursor: pointer;
  transition: transform .28s ease, box-shadow .28s ease, background .28s ease;
}
.t-dot-btn::before {
  content: '';
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,225,181,.35), transparent 62%);
  opacity: 0;
  transform: scale(.7);
  transition: opacity .28s ease, transform .28s ease;
}
.t-node:hover .t-dot-btn,
.t-node:focus-within .t-dot-btn,
.t-node.open .t-dot-btn {
  transform: scale(1.38);
  box-shadow:
    0 0 0 8px rgba(255,246,229,.12),
    0 0 34px rgba(255,165,73,.72);
}
.t-node:hover .t-dot-btn::before,
.t-node:focus-within .t-dot-btn::before,
.t-node.open .t-dot-btn::before { opacity: 1; transform: scale(1); }

.t-trigger {
  max-width: 430px;
  min-width: 0;
  padding: .75rem .9rem;
  border: 1px solid transparent;
  cursor: pointer;
  color: rgba(255,244,232,.72);
  transition: color .24s ease, border-color .24s ease, background .24s ease, transform .24s ease, filter .24s ease;
}
.t-trigger:hover,
.t-trigger:focus-visible {
  outline: none;
  border-color: rgba(255,218,181,.18);
  background: rgba(255,255,255,.045);
  color: #fff8ef;
  transform: translateY(-2px);
}
.t-pill {
  display: inline-block;
  margin-bottom: .38rem;
  padding: .18rem .58rem;
  border: 1px solid rgba(255,236,215,.18);
  background: color-mix(in srgb, var(--cat-color) 68%, transparent);
  color: #fffaf3;
  font-family: var(--font-mono);
  font-size: .7rem;
  letter-spacing: .08em;
}
.category-trigger {
  border: 0;
  padding: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}
.category-trigger:hover,
.category-trigger:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 3px; }
.t-name {
  display: block;
  font-size: clamp(1rem, 1.8vw, 1.18rem);
  font-weight: 700;
  line-height: 1.45;
  color: rgba(255,239,224,.66);
  filter: blur(.35px);
  text-shadow: 0 0 0 transparent;
  transition: color .24s ease, filter .24s ease, text-shadow .24s ease;
}
.t-dateline {
  display: block;
  margin-top: .28rem;
  font-family: var(--font-mono);
  font-size: .76rem;
  color: rgba(255,218,190,.52);
}
.t-node:hover .t-name,
.t-node:focus-within .t-name,
.t-node.open .t-name {
  color: #fffdf7;
  filter: blur(0);
  text-shadow: 0 0 18px rgba(255,196,129,.25);
}

.t-cardwrap {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transform: translateY(8px) scale(.985);
  transition: grid-template-rows .34s cubic-bezier(.2,.8,.2,1), opacity .22s ease, transform .28s ease;
}
.t-node:hover .t-cardwrap,
.t-node:focus-within .t-cardwrap,
.t-node.open .t-cardwrap {
  grid-template-rows: 1fr;
  opacity: 1;
  transform: translateY(0) scale(1);
}
.t-card-inner { overflow: hidden; }
.t-card {
  position: relative;
  overflow: hidden;
  margin-top: .4rem;
  border: 1px solid rgba(255,225,198,.24);
  background:
    linear-gradient(135deg, rgba(255,246,230,.14), rgba(255,236,215,.045) 38%, rgba(61,12,28,.66)),
    linear-gradient(90deg, color-mix(in srgb, var(--cat-color) 30%, transparent), transparent 38%),
    rgba(28,7,16,.82);
  color: var(--ink);
  padding: 1.05rem 1.08rem 1.12rem;
  box-shadow:
    0 22px 54px rgba(0,0,0,.34),
    0 0 38px color-mix(in srgb, var(--cat-color) 22%, transparent),
    inset 0 1px 0 rgba(255,255,255,.16);
  backdrop-filter: blur(16px) saturate(130%);
}
.t-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(115deg, rgba(255,255,255,.22), transparent 18% 78%, rgba(255,179,97,.12)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 18px);
  opacity: .7;
  pointer-events: none;
}
.t-card::after {
  content: '';
  position: absolute;
  left: 0;
  top: .85rem;
  bottom: .85rem;
  width: 3px;
  background: linear-gradient(180deg, transparent, var(--cat-color), #ffd2a0, var(--cat-color), transparent);
  box-shadow: 0 0 18px color-mix(in srgb, var(--cat-color) 62%, transparent);
}
.card-name,
.card-meta,
.card-desc,
.card-link { position: relative; z-index: 1; }
.lang-text { display: none; }
body[data-lang="zh"] .lang-zh,
body[data-lang="tw"] .lang-tw,
body[data-lang="en"] .lang-en { display: inline; }
p.lang-text { margin-bottom: .9rem; }
body[data-lang="zh"] p.lang-zh,
body[data-lang="tw"] p.lang-tw,
body[data-lang="en"] p.lang-en { display: block; }
.card-name::after {
  content: '';
  display: block;
  width: 3.2rem;
  height: 1px;
  margin-top: .62rem;
  background: linear-gradient(90deg, var(--cat-color), rgba(255,217,176,.14));
}
.card-name {
  margin-bottom: .5rem;
  font-family: var(--font-serif);
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.38;
  color: #fff9ef;
  text-shadow: 0 0 18px rgba(255,192,118,.18);
}
.card-meta {
  margin-bottom: .7rem;
  font-family: var(--font-mono);
  font-size: .74rem;
  color: rgba(255,219,188,.66);
}
.card-desc {
  margin-bottom: .9rem;
  color: rgba(255,240,224,.82);
  font-size: .92rem;
  line-height: 1.75;
}
.card-desc.is-empty { color: rgba(255,225,202,.48); }
.card-link {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 2.1rem;
  padding: .42rem .95rem;
  border: 1px solid rgba(255,225,198,.24);
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--cat-color) 72%, var(--crimson)), var(--flame));
  color: #fffaf2;
  font-family: var(--font-mono);
  font-size: .78rem;
  letter-spacing: .06em;
  text-decoration: none;
  transition: transform .18s ease, box-shadow .18s ease;
}
.card-link:hover,
.card-link:focus-visible {
  outline: none;
  transform: translateY(-1px);
  box-shadow: 0 10px 24px rgba(153,5,49,.32), 0 0 18px color-mix(in srgb, var(--cat-color) 34%, transparent);
}
.today-panel {
  position: relative;
  overflow: hidden;
  margin-bottom: clamp(2rem, 5vw, 3.4rem);
  border: 1px solid rgba(255,225,198,.18);
  background:
    linear-gradient(115deg, rgba(255,246,230,.09), rgba(204,83,17,.05) 36%, rgba(22,5,13,.58)),
    rgba(255,255,255,.035);
  padding: 1rem;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 18px 48px rgba(0,0,0,.22);
}
.today-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(255,210,160,.16), transparent 32% 70%, rgba(147,5,49,.18));
  pointer-events: none;
}
.today-head,
.today-list,
.today-empty,
.related-day { position: relative; z-index: 1; }
.today-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: .82rem;
}
.today-title {
  font-family: var(--font-serif);
  font-size: clamp(1.25rem, 3vw, 2rem);
  color: #fff8ef;
}
.today-date {
  font-family: var(--font-mono);
  font-size: .78rem;
  color: rgba(255,219,188,.62);
}
.today-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: .65rem;
}
.today-card,
.related-item {
  --cat-color: var(--flame);
  border: 1px solid color-mix(in srgb, var(--cat-color) 38%, rgba(255,225,198,.16));
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--cat-color) 18%, transparent), transparent 54%),
    rgba(255,255,255,.045);
  color: rgba(255,242,226,.82);
}
.today-card {
  padding: .82rem .9rem;
}
.today-meta,
.related-meta {
  display: block;
  margin-bottom: .3rem;
  font-family: var(--font-mono);
  font-size: .68rem;
  color: color-mix(in srgb, var(--cat-color) 72%, #ffe0bf);
}

<script>
/* ─── Config ──────────────────────────── */
const DATA_SOURCE = 'data.json';
const RECENT_YEAR_COUNT = 3;
const ARCHIVE_GROUP_SIZE = 3;

/* ─── i18n ────────────────────────────── */
const I18N = {

    footer: 'Made by Verdant',
    yearNav: 'Year navigation', categoryFilters: 'Category filters', chronicle: 'Chronicle',
    view: 'View', loading: 'Loading...', noData: 'No events in this period', noDetails: 'No additional details yet',
    searchLabel: 'Search', searchPlaceholder: 'Search names, dates, categories, or notes', clearSearch: 'Clear search',
    onThisDay: 'On This Day', todayEmpty: 'No historical events today', relatedSameDay: 'Same Date, Other Years',
    allCategories: 'All',
    catLabel: { 里程碑:'Milestone', 商务:'Business', 商演:'Commercial Show', Live:'Live', 音乐剧:'Musical', '访谈/电台':'Interview/Radio', 典礼:'Ceremony', 时尚:'Fashion', 综艺:'Variety', 见面会:'Fan Meet', 作品:'Works', 杂志:'Magazine', 其他演出:'Other Shows', 其他:'Other' },
  }
};

const CATEGORY_ORDER = ['里程碑','商务','商演','Live','音乐剧','访谈/电台','典礼','时尚','综艺','见面会','作品','杂志','其他演出','其他'];
const CATEGORY_SLUG = {
  里程碑:'milestone',
  商务:'business',
  商演:'commercial',
  Live:'live',
  音乐剧:'musical',
  '访谈/电台':'interview-radio',
  典礼:'ceremony',
  时尚:'fashion',
  综艺:'variety',
  见面会:'fan-meet',
  作品:'works',
  杂志:'magazine',
  其他演出:'other-shows',
  其他:'other'
};
const SLUG_CATEGORY = Object.fromEntries(Object.entries(CATEGORY_SLUG).map(([category,slug])=>[slug,category]));
const CATEGORY_SET = new Set(['all', ...CATEGORY_ORDER]);
const resolveCategory = value => {
  if(!value || value === 'all') return 'all';
  const decoded = (()=>{ try { return decodeURIComponent(value); } catch { return value; } })();
  return CATEGORY_SET.has(decoded) ? decoded : (SLUG_CATEGORY[decoded] || 'all');
};

const LANG_CONFIG = {
  zh: { htmlLang: 'zh-Hans', nameFields: ['nameZh','nameTw','nameEn'], descFields: ['descZh','descTw','descEn'] },
  tw: { htmlLang: 'zh-TW', nameFields: ['nameTw','nameZh','nameEn'], descFields: ['descTw','descZh','descEn'] },
  en: { htmlLang: 'en', nameFields: ['nameEn','nameTw','nameZh'], descFields: ['descEn','descTw','descZh'] },
};

const CAT_CLASS = {
  '里程碑':'cat-milestone','商务':'cat-business','商演':'cat-comm',
  'Live':'cat-live','音乐剧':'cat-musical',
  '访谈/电台':'cat-talk','典礼':'cat-ceremony',
  '时尚':'cat-fashion','综艺':'cat-variety','见面会':'cat-meet',
  '作品':'cat-work','杂志':'cat-magazine','其他演出':'cat-show','其他':'cat-other'
};

/* ─── State ───────────────────────────── */
const initialLang = LANG_CONFIG[new URLSearchParams(location.search).get('lang')]
  ? new URLSearchParams(location.search).get('lang')
  : 'zh';
const initialCatParam = new URLSearchParams(location.search).get('cat') || 'all';
const initialCategory = resolveCategory(initialCatParam);
const initialSearch = new URLSearchParams(location.search).get('q') || '';
let lang = initialLang, allEvents = [], activeGroup = null, activeCategory = initialCategory, searchQuery = initialSearch;
let sectionObserver = null;
let suppressObserver = false;

/* ─── Lang ────────────────────────────── */
function setLang(l) {
  lang = LANG_CONFIG[l] ? l : 'zh';
  document.documentElement.lang = LANG_CONFIG[lang].htmlLang;
  document.body.dataset.lang = lang;
  document.title = t('title');
  document.querySelector('.year-nav')?.setAttribute('aria-label', t('yearNav'));
  document.getElementById('categoryFilters')?.setAttribute('aria-label', t('categoryFilters'));
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  const clearBtn=document.getElementById('clearSearch');
  if(clearBtn) {
    clearBtn.setAttribute('aria-label', t('clearSearch'));
    clearBtn.title = t('clearSearch');
  }
  updateLocalizedChrome();
}

function updateSearchControl() {
  const input=document.getElementById('eventSearch');
  const clear=document.getElementById('clearSearch');
  if(input && input.value !== searchQuery) input.value = searchQuery;
  clear?.classList.toggle('visible', Boolean(searchQuery.trim()));
}

function bindLanguageControls() {
  const searchInput=document.getElementById('eventSearch');
  const clearSearch=document.getElementById('clearSearch');
  if(searchInput) {
    searchInput.value = searchQuery;
    searchInput.addEventListener('input', event=>{
      setSearch(event.target.value);
    });
  }
  clearSearch?.addEventListener('click',()=>{
    setSearch('');
    searchInput?.focus();
  });

  document.querySelectorAll('.lang-btn[data-lang]').forEach(btn=>{
    btn.addEventListener('click',event=>{
      event.preventDefault();
      setLang(btn.dataset.lang);
      history.replaceState(null, '', urlForState(lang, activeCategory, searchQuery, location.hash));
    });
  });

  document.addEventListener('click', event=>{
    const trigger=event.target.closest('[data-category-action][data-category]');
    if(!trigger) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    setCategory(trigger.dataset.category);
  }, true);
}

function updateLocalizedChrome() {
  document.querySelectorAll('.lang-btn[data-lang]').forEach(btn=>{
    btn.href = urlForState(btn.dataset.lang, activeCategory, searchQuery, location.hash);
  });
  document.querySelectorAll('.year-sub').forEach(el=>{ el.textContent = t('chronicle'); });
  document.querySelectorAll('.view-label').forEach(el=>{ el.textContent = t('view'); });
  document.querySelectorAll('.cat-label').forEach(el=>{
    el.textContent = I18N[lang].catLabel[el.dataset.category] || el.dataset.category;
  });
  document.querySelectorAll('.filter-chip[data-category]').forEach(el=>{
    const category=el.dataset.category;
    el.querySelector('.filter-label').textContent = category==='all' ? t('allCategories') : (I18N[lang].catLabel[category] || category);
  });
  updateSearchControl();
}

/* ─── CSV parser ──────────────────────── */
function parseCSV(text) {
  const re = /("(?:[^"]|"")*"|[^,\n\r]*)(,|\r?\n|\r|$)/g;
  const rows=[]; let row=[],m;
  while((m=re.exec(text))!==null){
    if(!m[0])break;
    const v=m[1].startsWith('"')?m[1].slice(1,-1).replace(/""/g,'"'):m[1];
    row.push(v.trim());
    if(m[2]!==','){rows.push(row);row=[];}
  }
  if(!rows.length)return[];
  const h=rows[0].map(s=>s.toLowerCase().replace(/\s/g,''));
  return rows.slice(1).filter(r=>r.some(c=>c)).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]||'');return o;});
}

/* ─── Normalise ───────────────────────── */
function normalise(row) {
  const g=(...keys)=>{for(const k of keys){const v=row[k];if(v!==undefined&&v!==null&&String(v).trim())return String(v).trim();}return '';};
  const date=g('date','日期');
  if(!date||!/\d{4}/.test(date))return null;
  return {
    date, time:g('time','時間','时间'), category:g('category','類別','类别'),
    nameTw:g('name-tw','name_tw','nameTw','名稱-繁','名称-繁','名稱-tw','名称-tw'),
    nameZh:g('name-zh','name_zh','nameZh','名稱-簡','名称-简','名稱-zh','名称-zh'),
    nameEn:g('name-en','name_en','nameEn','名稱-en','名称-en'),
    descTw:g('desc-tw','desc_tw','descTw','說明-繁','说明-繁','說明-tw','说明-tw'),
    descZh:g('desc-zh','desc_zh','descZh','說明-簡','说明-简','說明-zh','说明-zh'),
    descEn:g('desc-en','desc_en','descEn','說明-en','说明-en'),
    link:g('link','查看'),
  };
}

/* ─── Load ────────────────────────────── */
async function loadData() {
  try {
    const res = await fetch(DATA_SOURCE+'?_='+Date.now());
    if(!res.ok) throw new Error(res.status);
    const text = await res.text();
    const src = DATA_SOURCE.toLowerCase();
    let rows = src.endsWith('.json')
      ? (()=>{const j=JSON.parse(text);return Array.isArray(j)?j:j.data||j.events||[];})()
      : parseCSV(text);
    allEvents = rows.map(normalise).filter(Boolean);
    allEvents.sort((a,b)=>a.date.localeCompare(b.date));
    setLang(lang);
    renderAll();
  } catch(e) {
    const main=document.getElementById('timelineMain');
    if(main) main.innerHTML=`<div class="empty" id="loadingMsg">Error: ${esc(e.message)}</div>`;
  }
}

/* ─── Helpers ─────────────────────────── */
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const t = key => I18N[lang]?.[key] ?? I18N.zh[key] ?? '';
const firstText = (obj,fields)=>fields.map(field=>obj[field]).find(value=>value&&String(value).trim())||'';
const nameFor = ev=>firstText(ev, LANG_CONFIG[lang].nameFields)||'—';
const descFor = ev=>firstText(ev, LANG_CONFIG[lang].descFields);
const localizedName = (ev,l)=>firstText(ev, LANG_CONFIG[l].nameFields)||'—';
const localizedDesc = (ev,l)=>firstText(ev, LANG_CONFIG[l].descFields);
const normalizeSearchText = value => String(value || '').trim().toLocaleLowerCase();
const eventSearchText = ev => normalizeSearchText([
  ev.date, ev.time, ev.category,
  I18N.zh.catLabel[ev.category], I18N.tw.catLabel[ev.category], I18N.en.catLabel[ev.category],
  ev.nameZh, ev.nameTw, ev.nameEn,
  ev.descZh, ev.descTw, ev.descEn,
].filter(Boolean).join(' '));
const localToday = () => {
  const now = new Date();
  return {
    year: now.getFullYear(),
    monthDay: `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,
    label: `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`,
  };
};
const eventYear = ev => Number(String(ev.date).slice(0,4));
const eventMonthDay = ev => String(ev.date || '').slice(5,10);
const isPastSameDate = (ev, today=localToday()) => eventMonthDay(ev)===today.monthDay && eventYear(ev)<today.year;
const onThisDayEvents = () => {
  const today=localToday();
  return allEvents
    .filter(ev=>isPastSameDate(ev,today))
    .sort((a,b)=>b.date.localeCompare(a.date));
};
const sameDateEvents = ev => allEvents
  .filter(other=>other!==ev && eventMonthDay(other)===eventMonthDay(ev) && eventYear(other)!==eventYear(ev))
  .sort((a,b)=>b.date.localeCompare(a.date));
const localizedSpans = (ev,kind,className='') => ['zh','tw','en'].map(l=>{
  const value = kind==='name' ? localizedName(ev,l) : localizedDesc(ev,l);
  return `<span class="lang-text lang-${l}${className?' '+className:''}">${esc(value)}</span>`;
}).join('');
const localizedDescBlocks = ev => ['zh','tw','en'].map(l=>{
  const value = localizedDesc(ev,l);
  return value
    ? `<p class="card-desc lang-text lang-${l}">${esc(value)}</p>`
    : `<p class="card-desc is-empty lang-text lang-${l}">${esc(I18N[l].noDetails)}</p>`;
}).join('');
const searchedEvents = () => {
  const q=normalizeSearchText(searchQuery);
  if(!q) return allEvents;
  return allEvents.filter(e=>eventSearchText(e).includes(q));
};
const visibleEvents = () => {
  const events=searchedEvents();
  return activeCategory==='all' ? events : events.filter(e=>e.category===activeCategory);
};
const categoryLabel = category => category==='all'
  ? t('allCategories')
  : (I18N[lang].catLabel[category] || category);
const urlForState = (nextLang=lang,nextCategory=activeCategory,nextSearch=searchQuery,nextHash=location.hash) => {
  const params = new URLSearchParams();
  params.set('lang', nextLang);
  if(nextCategory && nextCategory !== 'all') params.set('cat', CATEGORY_SLUG[nextCategory] || nextCategory);
  if(nextSearch && String(nextSearch).trim()) params.set('q', String(nextSearch).trim());
  return location.pathname + '?' + params.toString() + (nextHash || '');
};
const getYears = ()=>[...new Set(allEvents.map(e=>e.date.slice(0,4)))].sort((a,b)=>b.localeCompare(a));
const groupLabel = g=>g.start===g.end?g.start:`${g.start}-${g.end}`;
const groupMatches = (g,ev)=>g.years.includes(ev.date.slice(0,4));

function getYearGroups() {
  const events=visibleEvents();
  const years = [...new Set(events.map(e=>e.date.slice(0,4)))].sort((a,b)=>b.localeCompare(a));
  const counts = Object.fromEntries(years.map(y=>[y,events.filter(e=>e.date.startsWith(y)).length]));
  const groups = years.slice(0,RECENT_YEAR_COUNT).map(year=>({
    years:[year], start:year, end:year, count:counts[year],
  }));
  const archiveYears = years.slice(RECENT_YEAR_COUNT);
  for(let i=0;i<archiveYears.length;i+=ARCHIVE_GROUP_SIZE) {
    const chunk = archiveYears.slice(i,i+ARCHIVE_GROUP_SIZE);
    const ordered = [...chunk].sort();
    groups.push({
      years: chunk,
      start: ordered[0],
      end: ordered[ordered.length-1],
      count: chunk.reduce((sum,y)=>sum+counts[y],0),
    });
  }
  return groups;
}

/* ─── Render all ──────────────────────── */
function renderAll() {
  if(!CATEGORY_SET.has(activeCategory)) activeCategory='all';
  const groups=getYearGroups();
  const loadingMsg=document.getElementById('loadingMsg');
  if(loadingMsg) loadingMsg.style.display='none';

  renderCategoryFilters();

  const tabsEl=document.getElementById('yearTabs');
  tabsEl.innerHTML='';
  const main=document.getElementById('timelineMain');
  if(!groups.length){
    activeGroup=null;
    if(main) main.innerHTML=`<div class="empty" id="loadingMsg">${esc(t('noData'))}</div>`;
    centerActiveFilter(false);
    sectionObserver?.disconnect();
    return;
  }
  groups.forEach(g=>{
    const key=groupLabel(g);
    const tab=document.createElement('button');
    tab.className='year-tab'+(key===(activeGroup||groupLabel(groups[0]))?' active':'');
    tab.dataset.group=key;
    tab.type='button';
    tab.innerHTML=key+`<span class="badge">${g.count}</span>`;
    tabsEl.appendChild(tab);
  });
  if(!activeGroup || !groups.some(g=>groupLabel(g)===activeGroup)) activeGroup=groupLabel(groups[0]);

  main.innerHTML='';
  main.insertAdjacentHTML('beforeend', renderOnThisDay());
  groups.forEach(g=>{
    const key=groupLabel(g);
    const sec=document.createElement('section');
    sec.className='year-section'+(key===activeGroup?' active':'');
    sec.id='group-'+key;
    sec.innerHTML=renderGroup(g);
    main.appendChild(sec);
  });
  setActiveGroup(activeGroup, false);
  bindRenderedControls();
  centerActiveFilter(false);
  observeYearSections();
}

function renderCategoryFilters() {
  const filtersEl=document.getElementById('categoryFilters');
  const searched=searchedEvents();
  const dataCategories=new Set(allEvents.map(e=>e.category));
  const counts={ all: searched.length };
  searched.forEach(e=>{ counts[e.category]=(counts[e.category]||0)+1; });
  const categories=['all', ...CATEGORY_ORDER.filter(category=>dataCategories.has(category))];
  if(filtersEl) {
    filtersEl.innerHTML=categories.map(category=>`
      <button class="filter-chip ${CAT_CLASS[category]||'cat-other'}${category===activeCategory?' active':''}" type="button" data-category-action="filter" data-category="${esc(category)}">
        <span class="filter-label">${esc(categoryLabel(category))}</span><span class="badge">${counts[category]||0}</span>
      </button>
    `).join('');
  }
}

function renderEventMiniCard(ev, className='today-card') {
  const catClass=CAT_CLASS[ev.category]||'cat-other';
  const catLabel=I18N[lang].catLabel[ev.category]||ev.category;
  const dateStr=ev.date.replace(/-00/g,'').replace(/-/g,'/');
  const timeStr=ev.time?` ${ev.time.slice(0,5)}`:'';
  return `
    <div class="${className} ${catClass}">
      <span class="${className==='today-card'?'today-meta':'related-meta'}">${esc(dateStr)}${esc(timeStr)} · ${esc(catLabel)}</span>
      <span class="${className==='today-card'?'today-name':'related-name'}">${esc(nameFor(ev))}</span>
    </div>
  `;
}

function renderOnThisDay() {
  const today=localToday();
  const events=onThisDayEvents();
  const content=events.length
    ? `<div class="today-list">${events.map(ev=>renderEventMiniCard(ev,'today-card')).join('')}</div>`
    : `<p class="today-empty">${esc(t('todayEmpty'))}</p>`;
  return `
    <section class="today-panel" aria-label="${esc(t('onThisDay'))}">
      <div class="today-head">
        <h2 class="today-title">${esc(t('onThisDay'))}</h2>
        <span class="today-date">${esc(today.label)}</span>
      </div>
      ${content}
    </section>
  `;
}

function renderRelatedSameDay(ev) {
  const related=sameDateEvents(ev);
  if(!related.length) return '';
  return `
    <div class="related-day">
      <div class="related-title">${esc(t('relatedSameDay'))}</div>
      <div class="related-list">${related.map(item=>renderEventMiniCard(item,'related-item')).join('')}</div>
    </div>
  `;
}

function bindRenderedControls() {
  document.querySelectorAll('.year-tab[data-group]').forEach(btn=>{
    btn.addEventListener('click',event=>{
      event.preventDefault();
      jumpToGroup(btn.dataset.group);
    });
  });
}

/* ─── Render group ────────────────────── */
function renderGroup(group) {
  const label=groupLabel(group);
  const evs=visibleEvents().filter(ev=>groupMatches(group,ev)).sort((a,b)=>b.date.localeCompare(a.date));
  if(!evs.length) return `<p class="empty">${I18N[lang].noData}</p>`;
  const sub={zh:'大事记',tw:'大事記',en:'Chronicle'};

  const items=evs.map((ev,idx)=>{
    const side=idx%2===0?'side-left':'side-right';
    const catClass=CAT_CLASS[ev.category]||'cat-other';
    const catLabel=I18N[lang].catLabel[ev.category]||ev.category;
    const name=nameFor(ev);
    const dateStr=ev.date.replace(/-00/g,'').replace(/-/g,'/');
    const timeStr=ev.time?ev.time.slice(0,5):'';
    const id=`ev-${label}-${idx}`;
    const linkHTML=ev.link
      ?`<a class="card-link" href="${esc(ev.link)}" target="_blank" rel="noopener">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M5 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V7M7 1h4m0 0v4M11 1L5.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg><span class="view-label">${t('view')}</span></a>`:'';
    const nameHTML=localizedSpans(ev,'name');
    const descHTML=localizedDescBlocks(ev);
    const relatedHTML=renderRelatedSameDay(ev);
    const catHTML=`<button class="cat-label category-trigger" type="button" data-category-action="event" data-category="${esc(ev.category)}">${esc(catLabel)}</button>`;
    const catTextHTML=`<span class="cat-label">${esc(catLabel)}</span>`;

    return `
<div class="t-node ${side} ${catClass}" id="${id}">
  <div class="t-spine">
    <button class="t-dot-btn" onclick="toggleNode('${id}', event)" aria-label="${esc(name)}" aria-expanded="false"></button>
  </div>
  <div class="t-trigger" onclick="toggleNode('${id}', event)" role="button" tabindex="0"
       onkeydown="if(event.key==='Enter'||event.key===' ')toggleNode('${id}')">
    <span class="t-pill">${catHTML}</span>
    <span class="t-name">${nameHTML}</span>
    <span class="t-dateline">${esc(dateStr)}${timeStr?'  '+esc(timeStr):''}</span>
  </div>
  <div class="t-cardwrap" aria-hidden="true">
    <div class="t-card-inner">
      <div class="t-card">
        <div class="card-name">${nameHTML}</div>
        <div class="card-meta">${esc(dateStr)}${timeStr?' · '+esc(timeStr):''} · ${catTextHTML}</div>
        ${descHTML}${relatedHTML}${linkHTML}
      </div>
    </div>
  </div>
</div>`;
  }).join('');

  return `
<div class="year-heading"><span class="yr">${label}</span><span class="yr-sub year-sub">${t('chronicle')}</span></div>
<div class="timeline-track">${items}</div>`;
}

function setCategory(category, event) {
  event?.preventDefault();
  event?.stopPropagation();
  event?.stopImmediatePropagation?.();
  activeCategory = resolveCategory(category);
  activeGroup = null;
  renderAll();
  updateLocalizedChrome();
  history.replaceState(null, '', urlForState(lang, activeCategory, searchQuery, '#timelineMain'));
  scrollToElement(document.getElementById('timelineMain'), 'auto');
  centerActiveFilter(false);
  return false;
}

function setSearch(value) {
  searchQuery = String(value || '');
  activeGroup = null;
  renderAll();
  updateLocalizedChrome();
  history.replaceState(null, '', urlForState(lang, activeCategory, searchQuery, '#timelineMain'));
}

function centerActiveFilter(smooth=true) {
  const rail=document.getElementById('categoryFilters');
  const chip=rail?.querySelector(`.filter-chip[data-category="${CSS.escape(activeCategory)}"]`);
  if(!rail || !chip) return;
  const left = chip.offsetLeft - (rail.clientWidth - chip.offsetWidth) / 2;
  rail.scrollTo({left: Math.max(0,left), behavior:smooth?'smooth':'auto'});
}

/* ─── Switch group ────────────────────── */
function switchGroup(key) {
  jumpToGroup(key);
}

function jumpToGroup(key) {
  suppressObserver = true;
  setActiveGroup(key, true);
  const target = document.querySelector(`#group-${CSS.escape(key)} .year-heading`) || document.getElementById('group-'+key);
  settleScrollTo(target, 'auto');
  history.replaceState(null, '', urlForState(lang, activeCategory, searchQuery, '#group-' + key));
  window.setTimeout(()=>{ suppressObserver = false; }, 700);
}

function scrollToElement(el, behavior='auto') {
  if(!el) return;
  const navHeight = document.querySelector('.year-nav')?.getBoundingClientRect().height || 0;
  const top = el.getBoundingClientRect().top + window.scrollY - navHeight - 16;
  window.scrollTo({top: Math.max(0, top), behavior});
}

function settleScrollTo(el, behavior='auto') {
  if(!el) return;
  scrollToElement(el, behavior);
  requestAnimationFrame(()=>scrollToElement(el, 'auto'));
  window.setTimeout(()=>scrollToElement(el, 'auto'), 120);
  window.setTimeout(()=>scrollToElement(el, 'auto'), 360);
}

function setActiveGroup(key, scrollTab=true) {
  activeGroup=key;
  document.querySelectorAll('.year-section').forEach(s=>s.classList.toggle('active',s.id==='group-'+key));
  document.querySelectorAll('.year-tab').forEach(b=>b.classList.toggle('active',b.dataset.group===key));
  centerYearTab(key, scrollTab);
}

function centerYearTab(key, smooth=true) {
  const rail=document.getElementById('yearTabs');
  const tab=document.querySelector(`.year-tab[data-group="${CSS.escape(key)}"]`);
  if(!rail || !tab) return;
  const left = tab.offsetLeft - (rail.clientWidth - tab.offsetWidth) / 2;
  rail.scrollTo({left: Math.max(0,left), behavior:smooth?'smooth':'auto'});
}

function observeYearSections() {
  sectionObserver?.disconnect();
  const sections=[...document.querySelectorAll('.year-section')];
  if(!sections.length) return;
  sectionObserver = new IntersectionObserver(entries=>{
    if(suppressObserver) return;
    const visible = entries
      .filter(entry=>entry.isIntersecting)
      .sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible) return;
    const key=visible.target.id.replace('group-','');
    if(key!==activeGroup) {
      setActiveGroup(key);
      history.replaceState(null, '', urlForState(lang, activeCategory, searchQuery, '#group-' + key));
    }
  }, { root:null, rootMargin:'-42% 0px -46% 0px', threshold:[0, .08, .18, .34, .5] });
  sections.forEach(section=>sectionObserver.observe(section));
}

/* ─── Toggle node ─────────────────────── */
function toggleNode(id, event) {
  if(event && window.matchMedia('(hover: hover)').matches && event.detail !== 0) return;
  const node=document.getElementById(id);
  if(!node)return;
  const wasOpen=node.classList.contains('open');
  node.closest('.year-section').querySelectorAll('.t-node.open').forEach(n=>{
    n.classList.remove('open');
    n.querySelector('.t-cardwrap').setAttribute('aria-hidden','true');
    n.querySelector('.t-dot-btn')?.setAttribute('aria-expanded','false');
  });
  if(!wasOpen){
    node.classList.add('open');
    node.querySelector('.t-cardwrap').setAttribute('aria-hidden','false');
    node.querySelector('.t-dot-btn')?.setAttribute('aria-expanded','true');
  }
}

/* ─── Touch / keyboard year nav ──────── */
let touchX=0;
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)<60)return;
  const groups=getYearGroups().map(groupLabel),idx=groups.indexOf(activeGroup);
  if(dx<0&&idx<groups.length-1)switchGroup(groups[idx+1]);
  if(dx>0&&idx>0)switchGroup(groups[idx-1]);
},{passive:true});
document.addEventListener('keydown',e=>{
  if(!['ArrowLeft','ArrowRight'].includes(e.key))return;
  const groups=getYearGroups().map(groupLabel),idx=groups.indexOf(activeGroup);
  if(e.key==='ArrowRight'&&idx<groups.length-1)switchGroup(groups[idx+1]);
  if(e.key==='ArrowLeft'&&idx>0)switchGroup(groups[idx-1]);
});

function bindTopButton() {
  const btn=document.querySelector('.to-top');
  if(!btn) return;
  btn.addEventListener('click',()=>{
    window.scrollTo({top:0, behavior:'smooth'});
  });
  const update=()=>btn.classList.toggle('visible', window.scrollY > 420);
  document.addEventListener('scroll', update, {passive:true});
  update();
}

bindLanguageControls();
bindTopButton();
loadData();
</script>
</body>
